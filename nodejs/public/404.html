<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | NovaTech</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #1a1a2e, #302b63);
            color: #f5f6fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.3), transparent 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 210, 211, 0.25), transparent 70%);
            bottom: -80px;
            right: -80px;
            border-radius: 50%;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) }
            50% { transform: translateY(30px) }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 700px;
        }

        .gif {
            width: 220px;
            height: 220px;
            margin: 0 auto 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .code {
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 800;
            background: linear-gradient(90deg, #6c5ce7, #00d2d3, #6c5ce7);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            line-height: 1;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        h1 {
            font-size: 1.8rem;
            margin: 1rem 0 0.8rem;
            color: #fff;
        }

        p {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .hint {
            color: #6c5ce7;
            font-size: 0.9rem;
            background: rgba(108, 92, 231, 0.15);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 2.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.9rem 2.2rem;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #6c5ce7, #00d2d3);
            transition: opacity 0.3s ease, transform 0.2s ease;
            margin: 0 0.5rem 0.5rem;
        }

        .btn:hover { opacity: 0.9; transform: scale(1.05); }

        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-outline:hover { border-color: #00d2d3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="gif">
            <img src="https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif"
                 alt="404 lost" width="220" height="220">
        </div>

        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>

        <span class="hint">You're clearly lost in cyberspace. Let's get you back!</span>

        <div>
            <a href="/" class="btn">← Back to Home</a>
            <a href="/about.html" class="btn btn-outline">Visit About</a>
        </div>
    </div>
</body>
</html>
